services:
  postgres:
    image: postgres:17
    container_name: comments-postgres
    environment:
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments_dev_pwd
      POSTGRES_DB: comments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comments"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: comments-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: comments-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: comments
      RABBITMQ_DEFAULT_PASS: comments_dev_pwd
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pgdata:
