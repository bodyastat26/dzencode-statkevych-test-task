name: comments-app

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comments_pwd}
      POSTGRES_DB: comments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comments"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: comments
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-comments_pwd}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=comments;Username=comments;Password=${POSTGRES_PASSWORD:-comments_pwd}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://comments:${RABBITMQ_PASSWORD:-comments_pwd}@rabbitmq:5672
      Storage__UploadsPath: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads: